[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "specmod"
dynamic = ["version"]
description = "A Python toolbox for processing and modelling seismic spectra"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "James Holt" }]
keywords = ["seismology", "spectra", "moment magnitude", "source parameters"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=2.0",   # np.trapezoid; np.trapz was the pre-2.0 spelling
    "scipy>=1.13",  # first release supporting numpy 2
    "obspy>=1.5",   # 1.4.x imports pkg_resources, gone from setuptools 81+
    "lmfit>=1.2",
    "pandas>=2.2.2",  # first release with numpy 2 ABI wheels
    "matplotlib>=3.9",  # numpy 2 support
    "pooch>=1.8",
]

[project.optional-dependencies]
multitaper = ["multitaper>=1.2"]
wavelet = ["PyWavelets>=1.5"]
mcmc = ["emcee>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
docs = [
    "sphinx>=7.3",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=3.0",
    "myst-nb>=1.1",
    "sphinx-autodoc-typehints>=2.2",
]

[project.urls]
Homepage = "https://github.com/sgjholt/SpecMod"
Repository = "https://github.com/sgjholt/SpecMod"
Issues = "https://github.com/sgjholt/SpecMod/issues"

[project.scripts]
specmod = "specmod.cli:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# Without this, setuptools-scm guesses the *next* version and produces
# "0.1.1.devN" — which collides with the v0.1.1 the Magna paper cites for a
# completely different code state. "no-guess-dev" yields "<last-tag>.post1.devN"
# instead, which claims nothing.
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["src/specmod"]


# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
    "NPY",           # numpy legacy API
    "RUF",           # ruff-specific (RUF012 mutable class attrs)
    "PL",            # pylint (PLW0603 global statements)
    "PT",            # pytest style
]
ignore = [
    "PLR0913",  # many arguments — unavoidable for scientific parameter sets
    "PLR2004",  # magic values in comparisons
]

[tool.ruff.lint.per-file-ignores]
# Legacy modules awaiting decomposition; see docs/REFACTOR_PLAN.md phases 2-5.
# E501 stays here because ruff format does not split long strings or comments,
# and rewrapping legacy prose is decomposition work, not formatting.
"src/specmod/spectral.py" = ["PLW0603", "RUF012", "N", "B", "SIM", "PLR", "PLW", "E501", "E741", "C4", "RUF", "PLC0415", "F811"]
"src/specmod/fitting.py" = ["RUF012", "B", "SIM", "PLR", "PLW", "A002", "E501", "C4", "RUF", "E741", "PLC0415"]
"src/specmod/preprocess.py" = ["B006", "PLR", "SIM", "E501", "PLW2901", "PLW0602"]
"src/specmod/utils.py" = ["RUF012", "B", "SIM", "PLR", "E501", "E741", "PLW2901", "E402", "UP", "C4", "RUF"]
"src/specmod/models.py" = ["PLW0603", "PLW0602"]

# Findings ruff confirms and the plan already tracks, silenced only so CI is
# green while the modules that carry them are still awaiting rewrite:
#   PLW0602/PLW0603  import-time global state              (§2.3, phase 2)
#   F811             `bsnr` class attr shadowed by the property (§2.4, phase 5)
#   PLC0415          the deliberate lazy mtspec import      (§2.1)
# Optional backend: the import is deferred so the package stays importable
# without the extra installed.
"src/specmod/transforms/prieto.py" = ["PLC0415"]
"tests/**" = ["PLR2004", "PLR0913", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"


# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/specmod"]

[[tool.mypy.overrides]]
# None of these ship type stubs.
module = [
    "obspy.*", "lmfit.*", "mtspec.*", "multitaper.*",
    "pooch.*", "matplotlib.*", "scipy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Migration backlog. Shrink this list each phase; target is an empty list.
# CI asserts it never grows.
module = [
    "specmod.spectral",
    "specmod.fitting",
    "specmod.preprocess",
    "specmod.utils",
    "specmod.models",
    "specmod.model_guess",
]
ignore_errors = true


# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "dataset: requires a downloaded dataset (deselect with '-m \"not dataset\"')",
    "slow: long-running test",
]
filterwarnings = [
    # Our own deprecations are errors; third-party ones we cannot fix are not.
    "error::DeprecationWarning:specmod.*",
    # obspy 1.5 on py3.11 trips importlib.metadata's SelectableGroups warning.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/specmod"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
