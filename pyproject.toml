[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "specmod"
dynamic = ["version"]
description = "A Python toolbox for processing and modelling seismic spectra"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "James Holt" }]
keywords = ["seismology", "spectra", "moment magnitude", "source parameters"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

# Every floor here is the version the suite was measured to pass on, not the
# oldest that imports — see the `floors` job in .github/workflows/test.yml and
# tools/check_floors.py. Two of them were wrong until measured: `lmfit>=1.2`
# was unsatisfiable against `numpy>=2.0`, and `scipy>=1.13` silently broke the
# quadratic multitaper.
dependencies = [
    "numpy>=2.0", # np.trapezoid; np.trapz was the pre-2.0 spelling
    # 1.15 reimplemented `scipy.optimize.nnls`. On 1.13/1.14 the vendored
    # `qiinv` inversion does not converge for every input scale, and the
    # quadratic estimator's peak recovery moves between 0.53 and 1.02 for the
    # same signal at different amplitudes — which its own scale-invariance
    # test catches, given a CI job that actually installs the floor.
    "scipy>=1.15",
    "obspy>=1.5",  # 1.4.x imports pkg_resources, gone from setuptools 81+
    # 1.2.x calls `np.asfarray`, removed in NumPy 2.0. `lmfit>=1.2` and
    # `numpy>=2.0` could never both be satisfied; every fit raised
    # AttributeError on that combination.
    "lmfit>=1.3",
    "pandas>=2.2.2",   # first release with numpy 2 ABI wheels
    "matplotlib>=3.9", # numpy 2 support
    "pooch>=1.8",
    "click>=8.1",      # every CLI in this project is a click command
]

[project.optional-dependencies]
# Reading and writing results. Not in the base install because the transform
# and fitting layers work entirely in memory; a user computing a spectrum and
# plotting it needs neither. `specmod.io` and `specmod.tables` say which to
# install when they are reached without it.
io = [
    "h5py>=3.11",    # arrays: one file per event, group per channel
    "pyarrow>=16.0", # tables: typed, compressed, queryable without loading
]
multitaper = ["multitaper>=1.2"]
wavelet = ["PyWavelets>=1.5"]
mcmc = ["emcee>=3.1"]
dev = [
    "h5py>=3.11",        # the io suite is not optional to *test*
    "pyarrow>=16.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
# `sphinx-autodoc-typehints` was here and is not any more: measured on this
# package it produced the same 367 documented objects as `sphinx.ext.autodoc`
# with `autodoc_typehints = "description"`, while calling an API Sphinx 10
# removes. `myst-nb` stays for the Phase 6 notebook pages, which are not built
# yet — see `docs/conf.py`.
docs = [
    "sphinx>=7.3",
    "furo>=2024.1",
    "myst-parser>=3.0",
    "myst-nb>=1.1",
    # Collapsible admonitions, via `:class: dropdown`. Sphinx has no built-in
    # spelling for one, and the alternative is raw <details>, which the theme
    # does not style. Small and single-purpose.
    "sphinx-togglebutton>=0.3",
]
tutorial = [ # for running the tutorial notebook, which is not part of the package
    "ipykernel>=7.0",
    "nbclient>=0.10",  # executes it; `pytest -m notebook` is the check
    "nbformat>=5.10",
]

[project.urls]
Homepage = "https://github.com/sgjholt/SpecMod"
Repository = "https://github.com/sgjholt/SpecMod"
Issues = "https://github.com/sgjholt/SpecMod/issues"

[project.scripts]
specmod = "specmod.cli:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# Without this, setuptools-scm guesses the *next* version and produces
# "0.1.1.devN" — which collides with the v0.1.1 the Magna paper cites for a
# completely different code state. "no-guess-dev" yields "<last-tag>.post1.devN"
# instead, which claims nothing.
version_scheme = "no-guess-dev"

# Only `v*` tags are code releases. Data artefacts are published under their
# own prefix (`data-v1`), and setuptools-scm's default `tag_regex` has an
# optional `(?:[\w-]+-)?` prefix group that strips `data-` and reads what is
# left as a version: measured, a `data-v1` tag takes the package from
# 0.1.0.post1.dev173 to **1**. Both settings are needed — `git_describe_command`
# keeps non-code tags out of `git describe`, `tag_regex` refuses to parse one
# if it gets there anyway.
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "v[0-9]*",
]
tag_regex = '^v(?P<version>\d+\.\d+\.\d+.*)$'

[tool.hatch.build.targets.wheel]
packages = ["src/specmod"]


# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",   # pycodestyle / pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "NPY", # numpy legacy API
    "RUF", # ruff-specific (RUF012 mutable class attrs)
    "PL",  # pylint (PLW0603 global statements)
    "PT",  # pytest style
]
ignore = [
    "PLR0913", # many arguments — unavoidable for scientific parameter sets
    "PLR2004", # magic values in comparisons
]

[tool.ruff.lint.per-file-ignores]
# `preprocess.py` is the last legacy module with any exemption at all, and it
# is down from six rules to three. `fitting.py` and `utils.py` are off this
# list entirely.
#
# Most of that fell out of annotating them rather than being aimed at: mutable
# default arguments (B006) had to become `None` to be typed, the class-level
# `None`/`{}` attributes that tripped RUF012 had to become declarations, and
# the loop-variable rebinding behind PLW2901 was what made several functions
# unannotatable in the first place.
#
# E501 stays for preprocess because ruff format does not split long strings or
# comments, and rewrapping legacy prose is decomposition work, not formatting.
"src/specmod/preprocess.py" = ["PLR", "SIM", "E501"]

# Vendored third-party code. Its structure is kept close to upstream so the
# diff stays reviewable; restructuring it to suit our lint rules would defeat
# the point of vendoring it verbatim.
"src/specmod/_vendor/*" = ["PLR0915"]

# Findings ruff confirms and the plan already tracks, silenced only so CI is
# green while the modules that carry them are still awaiting rewrite:
#   PLW0602/PLW0603  import-time global state              (§2.3, phase 2)
#   F811             `bsnr` class attr shadowed by the property (§2.4, phase 5)
#
# PLC0415 (imports not at top level) is deliberately NOT suppressed anywhere.
# Every remaining deferred import carries a `# noqa: PLC0415` with the reason
# at the site — an optional extra, or an import that is itself the assertion.
# A blanket ignore hid 48 of them, nearly all pure habit.
"tests/**" = ["PLR2004", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"


# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/specmod"]
# Hand-written ObsPy stubs; see stubs/README.md. ObsPy ships no py.typed and
# no stub package is published, so without these every Stream, Trace and
# UTCDateTime is `Any`.
mypy_path = "stubs"

[[tool.mypy.overrides]]
# None of these ship type stubs.
module = [
    "mtspec.*",
    "multitaper.*",
    "pooch.*",
    "matplotlib.*",
    "scipy.*",
    "h5py.*",
    "pyarrow.*",
    "pandas.*",
]
ignore_missing_imports = true

# There is no `ignore_errors` override any more. There used to be one holding
# fitting, preprocess and utils — 144 suppressed errors between them — and the
# whole package is now checked under `strict`. tests/test_typing_backlog.py
# fails if one is reintroduced, which is the only thing stopping the list
# growing back: mypy reports "no issues found in 39 source files" either way.


# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "dataset: requires a downloaded dataset (deselect with '-m \"not dataset\"')",
    "notebook: executes the tutorial notebook; needs a Jupyter kernel and ~40s",
    "slow: long-running test",
]
filterwarnings = [
    # Our own deprecations are errors; third-party ones we cannot fix are not.
    "error::DeprecationWarning:specmod.*",
    # obspy 1.5 on py3.11 trips importlib.metadata's SelectableGroups warning.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
    # matplotlib's mathtext calling pyparsing's camelCase API, which pyparsing
    # 3.3 deprecates. Only the `floors` job sees it, and it drowns that job:
    # 439 warnings against 4 elsewhere. Measured with pyparsing 3.3.2
    # throughout — matplotlib 3.9.0, 3.9.4 and 3.10.0 each produce 328 of them
    # in `test_io_and_plotting.py` alone, and 3.11.1 produces none. So it is
    # fixed above the declared `matplotlib>=3.9` floor, and raising the floor
    # to silence a warning that says nothing about this package would drop
    # support for two matplotlib minors for cosmetics. Delete this line when
    # the floor passes 3.11.
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/specmod"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
